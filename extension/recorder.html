<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Tonicstream 화면 녹화</title>
  <link rel="stylesheet" href="fonts/pretendard.css">
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 460px; margin: 0 auto; min-height: 100vh; padding: 18px 20px; }
    .big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); margin: 6px 0 2px; }
    label { display: flex; gap: 8px; align-items: center; margin-top: 8px; cursor: pointer; }
    input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
    .row button { flex: 1; padding: 9px 12px; font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><h1>화면 녹화</h1></header>

  <section id="idle">
    <p class="meta">모니터 전체, 다른 프로그램 창, 브라우저 탭 중 하나를 골라 녹화합니다.</p>
    <div class="card">
      <label><input type="checkbox" id="mic"> 마이크 소리 함께 녹음</label>
      <label><input type="checkbox" id="countdown" checked> 3초 센 뒤 시작</label>
      <p class="meta" style="margin:6px 0 0">컴퓨터 소리는 선택 창에서 <b>시스템 오디오 공유</b>를 켜면 함께 녹음됩니다.</p>
    </div>
    <div class="row"><button class="primary" id="start">녹화할 화면 선택</button></div>
    <div class="card" style="margin-top:12px">
      <div class="row" style="margin-top:0"><button id="cam">웹캠 창 띄우기</button></div>
      <p class="meta" style="margin:6px 0 0">내 얼굴이 작은 창으로 화면 위에 뜹니다. <b>모니터 전체</b>를 녹화하면 함께 찍힙니다. 창은 끌어서 옮기거나 크기를 바꿀 수 있습니다.</p>
      <video id="camv" muted playsinline hidden></video>
    </div>
  </section>

  <section id="counting" hidden>
    <p class="big" id="count" style="font-size:96px;text-align:center;margin:40px 0 8px">3</p>
    <p class="meta" style="text-align:center">곧 녹화를 시작합니다…</p>
  </section>

  <section id="recording" hidden>
    <p class="big" id="timer">● 0:00</p>
    <p class="meta" id="what"></p>
    <div class="row"><button class="primary" id="stop">정지 후 저장</button><button id="pause">일시정지</button></div>
    <p class="meta">이 창은 작게 내려 두세요. <b>닫으면 녹화가 취소됩니다.</b> 툴바의 Tonicstream 아이콘이나 브라우저의 "공유 중지" 버튼을 눌러도 바로 저장됩니다.</p>
  </section>

  <section id="done" hidden>
    <p id="saved" style="font-weight:600"></p>
    <div class="row">
      <button class="primary" id="again">다시 녹화</button>
      <button id="close">닫기</button>
    </div>
  </section>

  <p id="msg"></p>
  <script src="naming.js"></script>
  <script src="recorder.js"></script>
</body>
</html>
