<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>보관함 - Tonicstream</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="fonts/pretendard.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>레퍼런스 보관함</h1>
        <p class="meta" id="count"></p>
      </div>
      <div class="tools">
        <input id="q" type="text" placeholder="제목 · 계정 · 해시태그 · 보드 · 메모 검색" spellcheck="false">
        <button id="html" title="지금 보이는 기록을 한 장짜리 HTML 파일로 저장 (팀 전달용)">HTML 내보내기</button>
        <button id="csv" title="지금 보이는 기록을 엑셀용 CSV로 저장">CSV 내보내기</button>
        <button id="backup" title="보관함 전체를 백업 파일로 저장 (다른 PC나 새로 설치한 확장으로 옮길 때)">백업</button>
        <button id="restore" title="백업 파일에서 기록을 가져옵니다. 이미 있는 기록은 건너뜁니다">가져오기</button>
        <input type="file" id="restore-file" accept=".json,application/json" hidden>
        <button id="clear">전체 삭제</button>
      </div>
    </header>
    <p class="meta note">저장한 영상의 제목·원본 주소·날짜·미리보기를 이 브라우저에만 기록합니다. 영상 파일은 다운로드 폴더에 있고, 여기서 기록을 지워도 파일은 지워지지 않습니다. 기록은 300개까지 보관하며, 넘으면 보드·별점·메모·태그가 없는 오래된 기록부터 지워집니다.</p>
    <div class="filters">
      <div id="boardbar"></div>
      <div class="selects">
        <select id="f-kind" aria-label="저장 방법"></select>
        <select id="f-rating" aria-label="별점">
          <option value="0">모든 별점</option><option value="1">★ 1점 이상</option><option value="3">★ 3점 이상</option><option value="4">★ 4점 이상</option><option value="5">★ 5점</option>
        </select>
        <select id="f-sort" aria-label="정렬"><option value="new">최신순</option><option value="rating">별점순</option></select>
      </div>
    </div>
    <datalist id="boards"></datalist>
    <p id="msg"></p>
    <div id="list"></div>
  </main>
  <script src="library.js"></script>
</body>
</html>
