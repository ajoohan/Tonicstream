name: Deploy stream.plustonic.com

on:
  push:
    branches: [main]
    paths: ["docs/**", "extension/**", "scripts/**", "release-notes.txt", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 만들기와 올리기를 두 단계로 나눈다. 한 단계에서 하면 방금 올린 묶음을 배포 단계가 못 찾고 실패하는 일이 잦았다.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 배포할 때마다 extension/ 폴더로 ZIP을 새로 만들어 항상 최신 버전이 내려가게 함
      - name: Build extension ZIP
        run: |
          rm -f docs/tonicstream-extension.zip
          cd extension && zip -qr ../docs/tonicstream-extension.zip . -x '.*'
          cd .. && unzip -l docs/tonicstream-extension.zip

      # Edge 스토어 제출용 ZIP: 자체 업데이트 주소(update_url)와 Windows 업데이트 도우미를 뺀 것.
      # 스토어 설치본은 Edge가 업데이트하므로 둘 다 필요 없고, 스토어는 update_url이 있으면 받지 않는다.
      - name: Build store ZIP
        run: |
          rm -rf /tmp/store && cp -r extension /tmp/store
          rm -f /tmp/store/Tonicstream-update.cmd /tmp/store/tonicstream-update.ps1
          python3 - <<'PY'
          import json
          p = '/tmp/store/manifest.json'
          m = json.load(open(p, encoding='utf-8'))
          m.pop('update_url', None)
          json.dump(m, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
          rm -f docs/tonicstream-store.zip
          (cd /tmp/store && zip -qr "$GITHUB_WORKSPACE/docs/tonicstream-store.zip" . -x '.*')
          unzip -l docs/tonicstream-store.zip | tail -1

      # 회사 PC 자동 업데이트용: 서명한 CRX와 updates.xml을 만든다. 서명 열쇠(저장소 비밀값 CRX_PRIVATE_KEY)가 있을 때만.
      - name: Build signed CRX for auto-update
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -n "$CRX_PRIVATE_KEY" ]; then
            node scripts/pack-crx.mjs docs/tonicstream-extension.zip docs https://stream.plustonic.com
          else
            echo "CRX_PRIVATE_KEY is not set; skipping CRX (ZIP download still works)"
          fi

      # 설치된 확장이 새 버전이 나왔는지 확인할 때 읽는 파일.
      # 버전은 manifest.json에서, 안내 문구는 release-notes.txt(한 줄에 하나, 최대 3줄)에서 가져온다.
      - name: Write version.json
        run: |
          python3 - <<'PY'
          import json
          version = json.load(open('extension/manifest.json'))['version']
          notes = [l.strip() for l in open('release-notes.txt', encoding='utf-8') if l.strip()][:3]
          json.dump({'version': version, 'notes': notes}, open('docs/version.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print(open('docs/version.json', encoding='utf-8').read())
          # 소개 페이지에 적힌 버전(v0.0.0 꼴)도 같은 버전으로 맞춘다
          import re
          html = open('docs/index.html', encoding='utf-8').read()
          html, n = re.subn(r'\bv\d+\.\d+\.\d+\b', 'v' + version, html)
          open('docs/index.html', 'w', encoding='utf-8').write(html)
          print('index.html version labels updated:', n)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
